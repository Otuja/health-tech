version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: healthtech_db
    restart: always
    environment:
      POSTGRES_USER: healthtech_user
      POSTGRES_PASSWORD: healthtech_password
      POSTGRES_DB: healthtech_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: healthtech_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
