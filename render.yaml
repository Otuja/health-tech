services:
  - type: web
    name: healthtech-backend
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn core.wsgi:application"
    rootDir: backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://health-tech-psi.vercel.app,https://*.onrender.com"
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: healthtech-db
          property: connectionString

databases:
  - name: healthtech-db
    databaseName: healthtech_db
    user: healthtech_user
    plan: free
